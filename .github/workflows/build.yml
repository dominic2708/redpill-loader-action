
name: Build RedPill DS918+ DSM 6.2.4

on:
  workflow_dispatch:

jobs:
  redpill:
    name: Build DS918+ 6.2.4
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show build environment
        run: |
          uname -a
          gcc --version
          make --version
          docker --version

      - name: Build DS918+ DSM 6.2.4
        shell: bash
        run: |
          set -e
          bash build-ds918-6.2.4.sh

      - name: List generated images
        if: always()
        run: |
          echo "Generated IMG files:"
          find output -type f -name '*.img' -ls || true

      - name: Upload DS918+ loader
        uses: actions/upload-artifact@v4
        with:
          name: redpill-DS918-6.2.4-loader
          path: output/redpill-DS918+_6.2.4*.img
          if-no-files-found: error
          retention-days: 7
